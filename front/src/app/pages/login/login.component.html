<div class="card m-3">
<h5 class="card-header">Connexion</h5>
<div class="card-body">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
        <label>Login</label>
        <input
        type="text"
        formControlName="login"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && form['login'].errors }"
        />
        @if (submitted && form['login'].errors?.['required']) {
        <div class="invalid-feedback">Le login est obligatoire</div>
        }
    </div>

    <div class="form-group">
        <label>Mot de passe</label>
        <input
        type="password"
        formControlName="password"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
        />
        @if (submitted && form['password'].errors?.['required']) {
        <div class="invalid-feedback">Le mot de passe est obligatoire</div>
        }
    </div>

    <div class="text-center">
        <button class="btn btn-primary">Se connecter</button>
    </div>
    </form>
</div>
</div>
