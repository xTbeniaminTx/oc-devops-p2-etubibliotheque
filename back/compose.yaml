services:
  mysql:
    # version mysql fixée à 9.7
    image: 'mysql:9.7'
    environment:
      - 'MYSQL_DATABASE=${DB_NAME}'
      - 'MYSQL_USER=${DB_USER}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD}'
      - 'MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}'
    ports:
      - '3306'
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
